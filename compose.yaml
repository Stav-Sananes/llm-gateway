services:
  gateway:
    build: .
    image: llm-gateway:dev
    ports: ["8080:8080"]
    environment:
      GATEWAY_UPSTREAM_NAME: ollama
      GATEWAY_UPSTREAM_BASE_URL: http://ollama:11434/v1
      GATEWAY_DATABASE_URL: &database_url postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_TRACING_ENABLED: "true"
      GATEWAY_CACHE_ENABLED: "true"
      GATEWAY_QDRANT_URL: http://qdrant:6333
      GATEWAY_CACHE_EMBEDDING_MODEL: &embedding_model nomic-embed-text
      GATEWAY_CACHE_EMBEDDING_DIMS: "768"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.40.12
    volumes: ["ollama:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20

  # One-shot: pulls the demo chat model and the embedding model (for the semantic cache)
  # into the shared volume, then exits.
  ollama-pull:
    image: ollama/ollama:0.40.12
    environment:
      OLLAMA_HOST: ollama:11434
      CHAT_MODEL: ${DEMO_MODEL:-qwen2.5:0.5b}
      EMBEDDING_MODEL: *embedding_model
    entrypoint: ["sh", "-c", "ollama pull \"$$CHAT_MODEL\" && ollama pull \"$$EMBEDDING_MODEL\""]
    depends_on:
      ollama:
        condition: service_healthy

  # Semantic cache. Losing it only costs cache misses, so no volume.
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["127.0.0.1:6333:6333"]

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports: ["16686:16686"]

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    # Host port 5433: a locally installed Postgres often already holds 5432.
    # Localhost only: anyone who can write here can mint access (see docs/design/03).
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]
    # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
    # The init script (Grafana's read-only role) runs only when the volume is first created.
    volumes:
      - postgres:/var/lib/postgresql
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gateway"]
      interval: 2s
      retries: 15

  # Holds the key cache, rate limits, budgets and the usage queue. Append-only file, synced
  # every second, on a volume: a crash loses at most a second of queued usage events.
  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: ["redis:/data"]
    # Localhost only: a cache entry is trusted as much as a Postgres row.
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  # One-shot: brings the schema up to date, then exits. The gateway starts after it succeeds.
  migrate:
    image: llm-gateway:dev
    command: ["llm-gateway", "migrate"]
    environment:
      GATEWAY_DATABASE_URL: *database_url
    depends_on:
      postgres:
        condition: service_healthy

  # Drains usage events from the Redis Stream into Postgres. Safe to kill: anything it
  # hadn't acknowledged is delivered again.
  usage-worker:
    image: llm-gateway:dev
    command: ["llm-gateway", "usage-worker"]
    restart: unless-stopped
    environment:
      GATEWAY_DATABASE_URL: *database_url
      GATEWAY_REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # One-shot, after migrating: lets Grafana's read-only role read the dashboard's tables.
  grafana-grants:
    image: postgres:18.6-alpine
    environment:
      PGPASSWORD: gateway
    command: ["psql", "-h", "postgres", "-U", "gateway", "-d", "gateway", "-v", "ON_ERROR_STOP=1", "-f", "/grants/grafana-grants.sql"]
    volumes: ["./deploy/postgres-grants:/grants:ro"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      # Local demo: anonymous viewers, no login. Never like this anywhere shared.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gateway.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      prometheus:
        condition: service_started
      grafana-grants:
        condition: service_completed_successfully

volumes:
  ollama: {}
  postgres: {}
  redis: {}
