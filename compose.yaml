services:
  gateway:
    build: .
    image: llm-gateway:dev
    ports: ["8080:8080"]
    environment:
      GATEWAY_UPSTREAM_NAME: ollama
      GATEWAY_UPSTREAM_BASE_URL: http://ollama:11434/v1
      GATEWAY_DATABASE_URL: &database_url postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.40.12
    volumes: ["ollama:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20

  # One-shot: pulls the demo model into the shared volume, then exits.
  ollama-pull:
    image: ollama/ollama:0.40.12
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${DEMO_MODEL:-qwen2.5:0.5b}"]
    depends_on:
      ollama:
        condition: service_healthy

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports: ["16686:16686"]

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    # Host port 5433: a locally installed Postgres often already holds 5432.
    # Localhost only: anyone who can write here can mint access (see docs/design/03).
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"]
    # Postgres 18 images keep data under /var/lib/postgresql/<major>/, so mount the parent.
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gateway"]
      interval: 2s
      retries: 15

  # API-key cache only: losing it costs a Postgres lookup, so no volume.
  redis:
    image: redis:8.10.3-alpine
    # Localhost only: a cache entry is trusted as much as a Postgres row.
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  # One-shot: brings the schema up to date, then exits. The gateway starts after it succeeds.
  migrate:
    image: llm-gateway:dev
    command: ["llm-gateway", "migrate"]
    environment:
      GATEWAY_DATABASE_URL: *database_url
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ollama: {}
  postgres: {}
