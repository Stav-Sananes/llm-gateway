services:
  gateway:
    build: .
    ports: ["8080:8080"]
    environment:
      GATEWAY_UPSTREAM_NAME: ollama
      GATEWAY_UPSTREAM_BASE_URL: http://ollama:11434/v1
      GATEWAY_TRACING_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.40.12
    volumes: ["ollama:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20

  # One-shot: pulls the demo model into the shared volume, then exits.
  ollama-pull:
    image: ollama/ollama:0.40.12
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${DEMO_MODEL:-qwen2.5:0.5b}"]
    depends_on:
      ollama:
        condition: service_healthy

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports: ["16686:16686"]

volumes:
  ollama: {}
