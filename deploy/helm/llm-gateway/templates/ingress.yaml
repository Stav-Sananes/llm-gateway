{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "llm-gateway.fullname" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        # The client APIs only. /metrics is unauthenticated and stays inside the cluster.
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "llm-gateway.fullname" . }}
                port:
                  name: http
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: {{ include "llm-gateway.fullname" . }}
                port:
                  name: http
{{- end }}
