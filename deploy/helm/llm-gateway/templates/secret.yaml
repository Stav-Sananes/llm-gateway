{{- if not .Values.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-gateway.secretName" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  GATEWAY_DATABASE_URL: {{ required "secrets.databaseUrl is required (or set existingSecret)" $s.databaseUrl | quote }}
  GATEWAY_REDIS_URL: {{ required "secrets.redisUrl is required (or set existingSecret)" $s.redisUrl | quote }}
  {{- with $s.anthropicApiKey }}
  GATEWAY_ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with $s.qdrantApiKey }}
  GATEWAY_QDRANT_API_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
