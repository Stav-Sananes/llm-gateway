apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-gateway.fullname" . }}-config
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  GATEWAY_{{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  GATEWAY_PORT: {{ .Values.gateway.port | quote }}
  GATEWAY_SHUTDOWN_TIMEOUT_S: {{ .Values.gateway.shutdownTimeoutSeconds | quote }}
  GATEWAY_USAGE_WORKER_METRICS_PORT: {{ .Values.usageWorker.metricsPort | quote }}
---
{{- if .Values.policy }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-gateway.fullname" . }}-policy
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
data:
  policy.cedar: |
    {{- .Values.policy | nindent 4 }}
{{- end }}
